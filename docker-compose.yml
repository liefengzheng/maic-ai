version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maic-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      WEB_ORIGIN: http://haigoose.com,http://www.haigoose.com
      GOOGLE_CALLBACK_URL: http://haigoose.com/auth/google/callback
    networks:
      - maic-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: maic-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - maic-net

  nginx:
    image: nginx:1.25-alpine
    container_name: maic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - maic-net

networks:
  maic-net:
    driver: bridge
